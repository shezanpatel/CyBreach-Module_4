services:
  week13-primary:
    image: postgres:16
    container_name: wallet-week13-primary
    environment:
      POSTGRES_USER: ${WEEK13_POSTGRES_USER:-wallet_user}
      POSTGRES_PASSWORD: ${WEEK13_POSTGRES_PASSWORD:-wallet_password}
      POSTGRES_DB: ${WEEK13_POSTGRES_DB:-wallet_db}
      REPLICATION_PASSWORD: ${WEEK13_REPLICATION_PASSWORD:-wallet_replication_dev_password}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
    ports:
      - "55432:5432"
    volumes:
      - week13_primary_data:/var/lib/postgresql/data
      - ./week13-dr/init-primary.sh:/docker-entrypoint-initdb.d/01-replication.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${WEEK13_POSTGRES_USER:-wallet_user} -d ${WEEK13_POSTGRES_DB:-wallet_db}
      interval: 2s
      timeout: 5s
      retries: 30

  week13-replica:
    image: postgres:16
    container_name: wallet-week13-replica
    user: postgres
    environment:
      PGDATA: /var/lib/postgresql/data
      REPLICATION_PASSWORD: ${WEEK13_REPLICATION_PASSWORD:-wallet_replication_dev_password}
    entrypoint:
      - /bin/bash
      - /replica-entrypoint.sh
    ports:
      - "55433:5432"
    volumes:
      - week13_replica_data:/var/lib/postgresql/data
      - ./week13-dr/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    depends_on:
      week13-primary:
        condition: service_healthy

volumes:
  week13_primary_data:
  week13_replica_data:
