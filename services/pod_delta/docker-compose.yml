services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.5
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
    ports:
      - "19092:19092"
      - "18082:18082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 20

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.5
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - |
        rpk topic create \
          wallet.transaction \
          engagement.lifecycle \
          engagement.completed \
          mod3.score \
          achievement.awarded \
          leaderboard.updated \
          benchmark.computed \
          notification.sent \
          analytics.report \
          score.displayed \
          wallet.transaction.dlt \
          engagement.lifecycle.dlt \
          engagement.completed.dlt \
          mod3.score.dlt \
          achievement.awarded.dlt \
          leaderboard.updated.dlt \
          benchmark.computed.dlt \
          --brokers redpanda:9092 || true

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: cybreach
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cybreach
      POSTGRES_PASSWORD: cybreach
      POSTGRES_DB: cybreach
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybreach"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://cybreach:cybreach@postgres:5432/cybreach
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_ENABLE: "true"
      SECRET_KEY: change-me-in-production
      CLICKHOUSE_URL: http://clickhouse:8123
    ports:
      - "8000:8000"

networks:
  default:
    name: cybreach-delta
