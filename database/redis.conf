# Redis Leaderboard Engine - Production Configuration
requirepass StrongRedisPassword123!
bind 0.0.0.0
protected-mode yes
port 6379

# Persistence
appendonly yes
appendfsync everysec

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice

# Performance
tcp-keepalive 300
timeout 0
